<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joint Segmentation</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --axis: #c3c2b7;
    --accent: #256abf;
    --critical: #d03b3b;
    --upper: #3a7aec;
    --lower: #f58026;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --axis: #4a4a46;
      --accent: #6da7ec;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --axis: #4a4a46;
    --accent: #6da7ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
  }

  main { width: fit-content; max-width: calc(100% - 2rem); margin: 0 auto; padding: 2.25rem 0 2.5rem; }
  h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); line-height: 1.15; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 1.75rem; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.7rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .stage {
    --gap: clamp(1.25rem, 9vw, 8rem);
    --side: max(14rem, min(34rem, calc((100vw - 2rem - var(--gap)) / 2), calc(100vh - 18.5rem)));
    display: grid;
    grid-template-columns: repeat(2, var(--side));
    gap: var(--gap);
  }
  @media (max-width: 34rem) {
    .stage { grid-template-columns: min(24rem, calc(100vw - 2rem)); gap: 1rem; }
  }
  .box {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--axis);
    border-radius: 0.6rem;
    background: var(--surface);
    overflow: hidden;
  }
  .box.over { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent); }
  .box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  .box.has-result { cursor: pointer; }

  .empty { display: grid; justify-items: center; gap: 1.3rem; padding: 1rem; text-align: center; }
  .empty p { margin: 0; }
  .empty .big { font-size: clamp(1.15rem, 0.9rem + 1.1vw, 1.6rem); font-weight: 600; line-height: 1.25; }
  .empty .big.quiet { color: var(--muted); }
  .empty .under { min-height: 2.8rem; display: grid; place-items: center; }
  .empty .sub { color: var(--ink-2); font-size: 0.92rem; max-width: 22ch; }
  .empty .sub.failed { color: var(--ink); }
  .empty .sub.failed::before { content: "! "; font-weight: 700; color: var(--critical); }
  #choose {
    min-height: 2.8rem;
    padding: 0.5rem 1.4rem;
    border: 1.5px solid var(--ink);
    border-radius: 0.5rem;
    background: transparent;
    font-size: 1rem;
  }
  #choose:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }

  .pill, .legend, .busy { color: #f0efec; font-size: 0.82rem; }
  .pill {
    position: absolute; left: 50%; bottom: 0.7rem; transform: translateX(-50%);
    padding: 0.35rem 0.9rem;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.62);
    white-space: nowrap;
  }
  .pill:hover { background: rgba(0, 0, 0, 0.82); }
  .legend {
    position: absolute; left: 0.6rem; bottom: 0.6rem;
    padding: 0.25rem 0.6rem;
    border-radius: 0.4rem;
    background: rgba(0, 0, 0, 0.62);
    white-space: nowrap;
    pointer-events: none;
  }
  .legend .sw { display: inline-block; width: 0.65rem; height: 0.65rem; margin: 0 0.3rem 0 0.7rem; border-radius: 2px; vertical-align: -0.05rem; }
  .legend .sw:first-child { margin-left: 0; }
  .legend .sw.up { background: var(--upper); }
  .legend .sw.lo { background: var(--lower); }
  .busy { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; font-size: 1rem; background: rgba(0, 0, 0, 0.55); }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .note { width: 0; min-width: 100%; margin: 0.8rem 0 0; font-size: 0.92rem; color: var(--ink-2); }
  .note.warn { color: var(--ink); }
  .note.warn::before { content: "! "; font-weight: 700; color: var(--critical); }

  .samples { margin-top: 1.6rem; }
  .thumbs { width: 0; min-width: 100%; display: flex; flex-wrap: wrap; gap: 0.7rem; }
  .thumb {
    width: 4.25rem; aspect-ratio: 1; padding: 0;
    border: 1.5px solid var(--axis);
    border-radius: 0.45rem;
    background: #000;
    overflow: hidden;
  }
  .thumb canvas { display: block; width: 100%; height: 100%; }
  .thumb:hover { border-color: var(--accent); }
  .thumb[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

  #selftest { width: 0; min-width: 100%; margin: 1.6rem 0 0; white-space: pre-wrap; font: 0.85rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <h1>Joint Segmentation</h1>

  <div class="stage">
    <section id="drop" class="box" aria-label="Joint image">
      <div id="in-empty" class="empty">
        <p class="big">Drop joint image here</p>
        <div class="under"><button id="choose" type="button" title="Choose a PNG or JPEG file. It is read by this page only and is not sent anywhere.">or upload</button></div>
      </div>
      <canvas id="in" width="720" height="720" role="img" aria-label="The joint image" hidden></canvas>
      <button id="again" class="pill" type="button" title="Choose a PNG or JPEG file. It is read by this page only and is not sent anywhere." hidden>Upload another</button>
      <input id="file" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/*" tabindex="-1" aria-hidden="true">
    </section>

    <section id="outbox" class="box" aria-label="Segmentation">
      <div id="out-empty" class="empty">
        <p class="big quiet">Segmentation</p>
        <div class="under"><p id="status-text" class="sub" role="status" aria-live="polite">Loading model</p></div>
      </div>
      <canvas id="out" width="720" height="720" role="img" aria-label="The joint image with the model's two bone masks drawn in" hidden></canvas>
      <div id="busy" class="busy" role="status" aria-live="polite" hidden></div>
      <div id="legend" class="legend" hidden><span class="sw up"></span>upper bone <span class="sw lo"></span>lower bone</div>
    </section>
  </div>

  <p id="note" class="note" role="status" aria-live="polite" hidden></p>

  <section class="samples" aria-labelledby="h-samples">
    <h2 id="h-samples">Samples the model has not seen</h2>
    <div id="samples" class="thumbs"></div>
  </section>

  <pre id="selftest" hidden></pre>
</main>

<script src="demo/engine.js"></script>
<script src="demo/examples.js"></script>
<script>
(function () {
  "use strict";
  var E = window.HoasegEngine, EX = window.HOASEG_EXAMPLES;
  var N = 180, NPIX = N * N, VIEW = 720, SCALE = 4, PARTS = 5;
  var UPPER = [58, 122, 236], LOWER = [245, 128, 38];
  var UPPER_LINE = [109, 167, 236], LOWER_LINE = [255, 140, 46];
  var params = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  function setState(state, name) { document.body.dataset.state = state; if (name != null) document.body.dataset.name = name; }
  setState("idle", "");

  var statusText = $("status-text");
  function setStatus(text, failed) { statusText.textContent = text; statusText.className = failed ? "sub failed" : "sub"; }
  if (!E) {
    setStatus("The folder named demo is missing. Keep segment.html next to it.", true);
    return;
  }
  if (!EX) EX = [];
  document.querySelector(".samples").hidden = !EX.length;
  var ensemble = new E.Ensemble({ simd: params.has("nosimd") ? false : undefined, workers: params.has("noworkers") ? false : undefined });
  var loaded = 0, modelFailed = "", modelStart = Date.now();
  var resolveReady, rejectReady;
  var ready = new Promise(function (a, b) { resolveReady = a; rejectReady = b; });
  ready.catch(function () {});
  function fail(text) {
    if (modelFailed) return;
    modelFailed = text;
    setStatus(text, true);
    rejectReady(new Error(text));
  }
  window.HOASEG_WEIGHTS = function (k, b64) {
    ensemble.add(b64).then(function () {
      if (++loaded < PARTS) return;
      setStatus("");
      window.__modelReadyAt = Date.now();
      resolveReady();
    }, function (e) { fail("The model could not start: " + ((e && e.message) || e)); });
  };
  for (var k = 0; k < PARTS; k++) {
    (function (k) {
      var s = document.createElement("script");
      s.src = "demo/model/f" + k + ".js";
      s.onload = function () { s.remove(); };
      s.onerror = function () { fail("The model file demo/model/f" + k + ".js is missing. Keep segment.html next to its demo folder."); };
      document.head.appendChild(s);
    })(k);
  }

  function canvas(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

  function decode(blob) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" })
        .catch(function () { return createImageBitmap(blob); })
        .catch(function () { return viaImg(blob); });
    }
    return viaImg(blob);
  }
  function viaImg(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob), img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("not a picture this browser can read")); };
      img.src = url;
    });
  }

  function toGray(blob) {
    return decode(blob).then(function (bmp) {
      var w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
      if (!w || !h) throw new Error("the picture is empty");
      var c = canvas(N, N), ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, N, N);
      var exact = w === N && h === N;
      if (exact) { ctx.imageSmoothingEnabled = false; ctx.drawImage(bmp, 0, 0); }
      else {
        var side = Math.min(w, h);
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        ctx.drawImage(bmp, (w - side) / 2, (h - side) / 2, side, side, 0, 0, N, N);
      }
      if (bmp.close) bmp.close();
      var d = ctx.getImageData(0, 0, N, N).data, u8 = new Uint8Array(NPIX);
      for (var i = 0; i < NPIX; i++) {
        var r = d[4 * i], g = d[4 * i + 1], b = d[4 * i + 2];
        u8[i] = r === g && g === b ? r : Math.round(0.299 * r + 0.587 * g + 0.114 * b);
      }
      return { u8: u8, from: [w, h], resized: !exact };
    });
  }

  function stretch(u8) {
    var hist = new Uint32Array(256), n = 0, i;
    for (i = 0; i < NPIX; i++) if (u8[i] > 10) { hist[u8[i]]++; n++; }
    if (n < 50) return u8;
    function valueAt(rank) { var c = 0; for (var v = 11; v < 256; v++) { c += hist[v]; if (c > rank) return v; } return 255; }
    function pct(q) { var r = (q / 100) * (n - 1), lo = Math.floor(r), f = r - lo, a = valueAt(lo); return f ? a + (valueAt(lo + 1) - a) * f : a; }
    var lo = pct(1), hi = pct(99);
    if (hi - lo < 5) return u8;
    var out = new Uint8Array(NPIX);
    for (i = 0; i < NPIX; i++) {
      if (u8[i] <= 10) continue;
      var t = (u8[i] - lo) / (hi - lo);
      out[i] = (t < 0 ? 0 : t > 1 ? 1 : t) * 235 + 10;
    }
    return out;
  }

  function grayImage(ctx, gray) {
    var img = ctx.createImageData(N, N);
    for (var i = 0; i < NPIX; i++) { img.data[4 * i] = img.data[4 * i + 1] = img.data[4 * i + 2] = gray[i]; img.data[4 * i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }

  function enlarge(gray) {
    var small = canvas(N, N);
    grayImage(small.getContext("2d"), gray);
    var big = canvas(VIEW, VIEW), ctx = big.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(small, 0, 0, VIEW, VIEW);
    return ctx.getImageData(0, 0, VIEW, VIEW);
  }

  var GAUSS = (function () { var k = [], s = 0, i; for (i = -5; i <= 5; i++) { k.push(Math.exp(-(i * i) / (2 * 1.2 * 1.2))); s += k[i + 5]; } return k.map(function (v) { return v / s; }); })();

  function softMask(lab, cls) {
    var a = new Float32Array(VIEW * VIEW), b = new Float32Array(VIEW * VIEW), x, y, i, j, s;
    for (y = 0; y < VIEW; y++) {
      var sy = (y + 0.5) / SCALE - 0.5, y0 = Math.floor(sy), fy = sy - y0, ya = y0 < 0 ? 0 : y0, yb = y0 + 1 > N - 1 ? N - 1 : y0 + 1;
      for (x = 0; x < VIEW; x++) {
        var sx = (x + 0.5) / SCALE - 0.5, x0 = Math.floor(sx), fx = sx - x0, xa = x0 < 0 ? 0 : x0, xb = x0 + 1 > N - 1 ? N - 1 : x0 + 1;
        var v00 = lab[ya * N + xa] === cls ? 1 : 0, v01 = lab[ya * N + xb] === cls ? 1 : 0, v10 = lab[yb * N + xa] === cls ? 1 : 0, v11 = lab[yb * N + xb] === cls ? 1 : 0;
        a[y * VIEW + x] = (v00 * (1 - fx) + v01 * fx) * (1 - fy) + (v10 * (1 - fx) + v11 * fx) * fy;
      }
    }
    for (y = 0; y < VIEW; y++) for (x = 0; x < VIEW; x++) {
      for (s = 0, j = -5; j <= 5; j++) { i = x + j; if (i < 0) i = -i; else if (i >= VIEW) i = 2 * VIEW - 2 - i; s += a[y * VIEW + i] * GAUSS[j + 5]; }
      b[y * VIEW + x] = s;
    }
    var out = new Uint8Array(VIEW * VIEW);
    for (y = 0; y < VIEW; y++) for (x = 0; x < VIEW; x++) {
      for (s = 0, j = -5; j <= 5; j++) { i = y + j; if (i < 0) i = -i; else if (i >= VIEW) i = 2 * VIEW - 2 - i; s += b[i * VIEW + x] * GAUSS[j + 5]; }
      out[y * VIEW + x] = s * 255 + 0.5;
    }
    return out;
  }

  function paint(cnv, base, soft, style) {
    var out = new ImageData(new Uint8ClampedArray(base.data), VIEW, VIEW), d = out.data;
    for (var c = 0; c < 2; c++) {
      var m = soft[c], col = style === "fill" ? (c ? LOWER : UPPER) : (c ? LOWER_LINE : UPPER_LINE);
      for (var i = 0; i < VIEW * VIEW; i++) {
        var v = m[i] / 255, w;
        if (style === "fill") { w = (v - 0.5) * 4 + 0.5; w = (w < 0 ? 0 : w > 1 ? 1 : w) * 0.48; }
        else { w = (0.42 - Math.abs(v - 0.5)) * 12; w = (w < 0 ? 0 : w > 1 ? 1 : w) * 0.95; }
        if (!w) continue;
        d[4 * i] = d[4 * i] * (1 - w) + col[0] * w;
        d[4 * i + 1] = d[4 * i + 1] * (1 - w) + col[1] * w;
        d[4 * i + 2] = d[4 * i + 2] * (1 - w) + col[2] * w;
      }
    }
    cnv.getContext("2d").putImageData(out, 0, 0);
  }

  function unrun(runs) { var lab = new Uint8Array(NPIX), p = 0; for (var i = 0; i < runs.length; i += 2) { lab.fill(runs[i], p, p + runs[i + 1]); p += runs[i + 1]; } return lab; }
  function count(lab, cls) { var n = 0; for (var i = 0; i < NPIX; i++) if (lab[i] === cls) n++; return n; }

  var dropBox = $("drop"), outBox = $("outbox"), inCanvas = $("in"), outCanvas = $("out");
  var busy = $("busy"), legend = $("legend"), note = $("note"), thumbs = [];
  var current = 0, view = null, style = "fill";

  function setNote(text, warn) { note.textContent = text; note.className = warn ? "note warn" : "note"; note.hidden = !text; }
  function markSample(i) { thumbs.forEach(function (t, j) { t.setAttribute("aria-pressed", j === i ? "true" : "false"); }); }

  function show(blob, name, sample) {
    var token = ++current, step = "read";
    setState("working", name);
    return toGray(blob).then(function (gray) {
      if (token !== current) return null;
      step = "model";
      setNote("");
      markSample(sample);
      var base = enlarge(stretch(gray.u8));
      view = { base: base, soft: null };
      inCanvas.getContext("2d").putImageData(base, 0, 0);
      outCanvas.getContext("2d").putImageData(base, 0, 0);
      $("in-empty").hidden = true; inCanvas.hidden = false; $("again").hidden = false;
      $("out-empty").hidden = true; outCanvas.hidden = false; legend.hidden = true;
      outBox.classList.remove("has-result"); outBox.removeAttribute("title");
      busy.textContent = loaded < PARTS ? "Loading model" : "Segmenting"; busy.hidden = false;
      return ready.then(function () {
        if (token === current) busy.textContent = "Segmenting";
        return ensemble.segment(gray.u8);
      }).then(function (res) {
        if (token !== current) return null;
        step = "draw";
        view.soft = [softMask(res.labels, 1), softMask(res.labels, 2)];
        paint(outCanvas, base, view.soft, style);
        busy.hidden = true; legend.hidden = false;
        outBox.classList.add("has-result"); outBox.title = "Click to switch between filled bones and outlines";
        var up = count(res.labels, 1), lo = count(res.labels, 2), said = [];
        if (!up || !lo) said.push("The model found " + (!up && !lo ? "no bone" : !up ? "no upper bone" : "no lower bone") + " in this image.");
        if (gray.resized) said.push("This image is " + gray.from[0] + " by " + gray.from[1] + " pixels. It was cut to its middle square and resized to 180 by 180, " +
          "the only size the model was trained on, so the result is unchecked.");
        setNote(said.join(" "), true);
        setState("done");
        return res;
      });
    }).catch(function (e) {
      if (token !== current) return null;
      var why = (e && e.message) || String(e);
      if (step === "read") setNote("That file could not be read as an image. Use a PNG or JPEG file.", true);
      else {
        busy.textContent = modelFailed || (step === "model" ? "The model stopped on this image (" + why + ")." : "The result could not be drawn (" + why + ").");
        busy.hidden = false;
      }
      setState("error");
      return null;
    });
  }

  outBox.addEventListener("click", function () {
    if (!view || !view.soft) return;
    style = style === "fill" ? "line" : "fill";
    paint(outCanvas, view.base, view.soft, style);
  });

  var fileInput = $("file");
  function take(list) { if (list && list.length) show(list[0], list[0].name || "pasted image", -1); }
  $("choose").onclick = $("again").onclick = function () { fileInput.click(); };
  fileInput.onchange = function () { take(fileInput.files); fileInput.value = ""; };
  ["dragenter", "dragover"].forEach(function (t) { window.addEventListener(t, function (e) { e.preventDefault(); dropBox.classList.add("over"); }); });
  window.addEventListener("dragleave", function (e) { e.preventDefault(); if (e.relatedTarget === null) dropBox.classList.remove("over"); });
  window.addEventListener("drop", function (e) { e.preventDefault(); dropBox.classList.remove("over"); if (e.dataTransfer) take(e.dataTransfer.files); });
  window.addEventListener("paste", function (e) { if (e.clipboardData) take(e.clipboardData.files); });

  function blobOf(ex) { return new Blob([E.bytesFromBase64(ex.png)], { type: "image/png" }); }
  EX.forEach(function (ex, i) {
    var b = document.createElement("button"), c = canvas(N, N);
    b.type = "button"; b.className = "thumb"; b.setAttribute("aria-pressed", "false");
    b.title = ex.type + " joint, KL " + ex.kl + (ex.note ? " (" + ex.note + ")" : "");
    b.setAttribute("aria-label", "Sample " + (i + 1) + ": " + b.title);
    toGray(blobOf(ex)).then(function (gray) { grayImage(c.getContext("2d"), stretch(gray.u8)); }, function () {});
    b.appendChild(c);
    b.onclick = function () { show(blobOf(ex), ex.file, i); };
    $("samples").appendChild(b);
    thumbs.push(b);
  });

  if (params.has("selftest")) {
    var out = $("selftest"), lines = [], worst = 0, bad = 0, n = 0, t0 = Date.now(), how = "";
    out.hidden = false;
    out.textContent = "Running the samples";
    (function step() {
      if (n === EX.length) {
        lines.unshift((bad ? "FAILED" : "PASSED") + ": at most " + worst + " pixels differ in one joint. " + how +
          "Model loaded in " + (((window.__modelReadyAt || Date.now()) - modelStart) / 1000).toFixed(1) + " s, all samples in " + ((Date.now() - t0) / 1000).toFixed(1) + " s.");
        out.textContent = lines.join("\n");
        document.title = (bad ? "selftest FAILED" : "selftest PASSED") + " | Joint Segmentation";
        window.__selftest = { passed: !bad, worst: worst, lines: lines };
        return;
      }
      var ex = EX[n];
      show(blobOf(ex), ex.file, n).then(function (res) {
        if (!res) { bad++; lines.push(ex.file + ": no result"); }
        else {
          var want = unrun(ex.expected), diff = 0;
          for (var i = 0; i < NPIX; i++) if (want[i] !== res.labels[i]) diff++;
          worst = Math.max(worst, diff);
          if (diff > 10) bad++;
          how = (res.simd ? "SIMD" : "plain JavaScript") + ", " + (res.workers ? "5 workers" : "no workers") + ". ";
          lines.push(ex.file + ": " + diff + " of 32,400 pixels differ from PyTorch, " + (res.ms / 1000).toFixed(2) + " s");
        }
        n++;
        step();
      });
    })();
  }
})();
</script>
